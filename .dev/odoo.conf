# ---------------------------------------------------------------------------
# 容器内的 Odoo 配置（compose 把它挂到 /etc/odoo/odoo.conf）
#
# ○ 这里写的路径都是**容器内**的；宿主机仓库挂在 /mnt/extra-addons。
# ○ --dev=all 写不进配置文件（Odoo 标了 file_exportable=False），只能命令行传，
#   所以启动一律走 .dev/compose.yml 的 command 或 .vscode/tasks.json。
# ○ workers 必须为 0：多进程模式下不挂文件监听，热重载失效。
# ○ 不支持行尾注释：Odoo 的 configparser 会把 "1  # 注释" 整个当值，
#   int() 直接抛 ValueError: invalid literal for int()。说明只能写成整行注释。
# ---------------------------------------------------------------------------

[options]

# 本仓库；官方镜像自带的核心 addons 会被自动加入，不用写
addons_path = /mnt/extra-addons

# filestore / sessions（compose 里对应 odoo-filestore 卷）
data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

# 建库 / 删库要用（http://localhost:8069/web/database/manager）
admin_passwd = dev-admin-pwd

http_port = 8069
http_interface = 0.0.0.0

workers = 0
# 设 1 才会跑定时任务；不想被 cron 打扰就设 0
max_cron_threads = 1

log_level = info

# 只看某个模块的日志时打开：log_handler = odoo.addons.<module>:DEBUG
# 看完整 SQL：把 log_level 改成 debug_sql
